# =============================================================
#  Profil "integration" — tests @SpringBootTest avec base réelle
# =============================================================
# Utilise SQLite in-memory pour rester aligné avec le moteur de production
# tout en restant rapide (pas de fichier sur disque, pas de Docker).

# Base SQLite en mémoire — partagée entre toutes les connexions du pool
# `cache=shared` permet de garder la même DB entre les connexions Hikari
spring.datasource.url=jdbc:sqlite:file::memory:?cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=10000

# Dialect SQLite (identique à la prod)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Schéma recréé à chaque démarrage de contexte de test (drop + create)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Scheduler désactivé (pas de Boursorama/CoinGecko dans les tests)
scheduler.enabled=false

# Mot de passe admin initial requis par DataInitializer
myfinance.admin.initial-password=IntegrationTestAdminPass1!

# CSRF désactivé pour simplifier les requêtes MockMvc (cohérent avec dev)
security.csrf.enabled=false

# Brute-force désactivé en intégration — sinon le test enchaîne les login et se retrouve bloqué
security.login.max-attempts=999
security.login.base-lock-minutes=0
security.login.max-lock-minutes=0

# Swagger désactivé en intégration (économie au démarrage)
myfinance.swagger.enabled=false
