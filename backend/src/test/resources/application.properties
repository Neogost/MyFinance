# Propriétés par défaut pour tous les tests
# Évite d'avoir à les répéter dans chaque @TestPropertySource

# CSRF désactivé : les tests MockMvc n'embarquent pas de cookie XSRF-TOKEN
security.csrf.enabled=false

# Origine CORS par défaut (surchargeable par @TestPropertySource dans les tests qui en ont besoin)
cors.allowed-origins=http://localhost:3000

# Mot de passe initial admin — valeur arbitraire pour les tests (DataInitializer ne s'exécute
# pas en @WebMvcTest mais peut être chargé par d'autres types de tests d'intégration)
myfinance.admin.initial-password=TestAdminPassword1
