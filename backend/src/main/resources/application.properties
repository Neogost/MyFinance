# Nom de l'application
spring.application.name=myFinance

# Profil actif par défaut
spring.profiles.active=dev

# Port du serveur
server.port=8080

# Encodage
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# Session HTTP — durée de vie étendue pour éviter les déconnexions intempestives
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Paramètres fiscaux — barème IRPP (mis à jour annuellement par l'admin)
spring.config.import=classpath:tax-parameters.yml,classpath:patrimoine-referentiel.yml

# Protection brute-force — valeurs par défaut (surchargées par profil dev/prod)
security.login.max-attempts=5

# Timeouts HTTP clients de marché (ms) — surchargeable par profil
market.data.timeout-ms=10000
security.login.base-lock-minutes=5
security.login.max-lock-minutes=80