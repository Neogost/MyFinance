# ===== Profil Docker — HTTP sans SSL =====
# Le HTTPS est géré par le reverse proxy QNAP (myQNAPcloud / Application Portal)
server.port=8080
server.ssl.enabled=false
server.servlet.session.timeout=4h
server.servlet.session.cookie.secure=false

# ===== BASE DE DONNÉES SQLite =====
spring.datasource.url=jdbc:sqlite:/data/myfinance.db?busy_timeout=30000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# update : crée le schéma au premier démarrage, bénin ensuite
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== SCHEDULER =====
scheduler.enabled=true

# ===== CSRF =====
security.csrf.enabled=true

# ===== CORS =====
# Surchargeable via la variable d'environnement CORS_ALLOWED_ORIGINS dans docker-compose.yml
cors.allowed-origins=http://localhost:8080

# ===== LOGS =====
logging.level.com.myfinance=INFO
logging.level.org.springframework=WARN
logging.file.name=/logs/myfinance.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# ===== PROTECTION BRUTE-FORCE =====
security.login.max-attempts=5
security.login.base-lock-minutes=5
security.login.max-lock-minutes=160

# Mot de passe initial admin — valeur arbitraire pour les tests (DataInitializer ne s'exécute
# pas en @WebMvcTest mais peut être chargé par d'autres types de tests d'intégration)
myfinance.admin.initial-password=gyvmyw-jihFip-kudsi0
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false