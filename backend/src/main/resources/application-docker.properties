# ===== Profil Docker — HTTP sans SSL =====
# Le HTTPS est géré par le reverse proxy QNAP (myQNAPcloud / Application Portal)
server.port=8080
server.ssl.enabled=false
server.servlet.session.cookie.secure=false

# ===== BASE DE DONNÉES SQLite =====
spring.datasource.url=jdbc:sqlite:/data/myfinance.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# update : crée le schéma au premier démarrage, bénin ensuite
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== SCHEDULER =====
scheduler.enabled=true

# ===== CORS =====
# Surchargeable via la variable d'environnement CORS_ALLOWED_ORIGINS dans docker-compose.yml
cors.allowed-origins=http://localhost:8080

# ===== LOGS =====
logging.level.com.myfinance=INFO
logging.level.org.springframework=WARN

# ===== PROTECTION BRUTE-FORCE =====
security.login.max-attempts=5
security.login.base-lock-minutes=5
security.login.max-lock-minutes=160
