## Barème kilométrique fiscal — Voitures automobiles
## Source : Bulletin Officiel des Finances Publiques (BOFiP), arrêté annuel.
## Mettre à jour ce fichier après chaque loi de finances (parution en mars de l'année N pour les revenus N-1).
## Formule : montant = km × taux + forfait

