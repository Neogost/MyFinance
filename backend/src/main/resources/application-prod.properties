# ===== HTTPS / TLS =====
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:/share/myFinance/ssl/myfinance.p12
server.ssl.key-store-password=CHANGE_ME
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=myfinance
server.servlet.session.timeout=4h

# Cookie session transmis uniquement sur HTTPS
server.servlet.session.cookie.secure=true

# ===== BASE DE DONNEES SQLite =====
spring.datasource.url=jdbc:sqlite:/share/myFinance/data/myfinance.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Validation du schéma sans modification en prod
spring.jpa.hibernate.ddl-auto=validate

# Logs SQL désactivés en prod
spring.jpa.show-sql=false

# Scheduler Yahoo Finance activé en prod
scheduler.enabled=true

# CORS — même origine en prod (frontend servi par Spring Boot), mais valeur requise par @Value
# Mettre à jour avec l'IP/domaine réel si besoin
cors.allowed-origins=https://localhost:8443

# Logs applicatifs
logging.level.com.myfinance=INFO
logging.level.org.springframework=WARN

# Protection brute-force
security.login.max-attempts=5
security.login.base-lock-minutes=5
security.login.max-lock-minutes=160

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false