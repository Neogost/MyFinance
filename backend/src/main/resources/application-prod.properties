# ===== BASE DE DONNEES SQLite =====
spring.datasource.url=jdbc:sqlite:/share/myFinance/data/myfinance.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Validation du schéma sans modification en prod
spring.jpa.hibernate.ddl-auto=validate

# Logs SQL désactivés en prod
spring.jpa.show-sql=false

# Scheduler Yahoo Finance activé en prod
scheduler.enabled=true

# CORS — à adapter selon l'adresse du NAS
cors.allowed-origins=http://localhost:3000

# Logs applicatifs
logging.level.com.myfinance=INFO
logging.level.org.springframework=WARN

# Protection brute-force
security.login.max-attempts=5
security.login.base-lock-minutes=5
security.login.max-lock-minutes=160