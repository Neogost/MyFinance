## Barèmes retraite France — à réviser si réforme ou revalorisation annuelle
## Réforme 2023 intégrée (âge légal 64 ans, durée 172 trimestres pour générations 1965+)

retirement:

  ## ── PASS (Plafond Annuel Sécurité Sociale) ───────────────────────────────
  pass:
    history:
      - { year: 2024, value: 46368 }
      - { year: 2023, value: 43992 }
      - { year: 2022, value: 41136 }
      - { year: 2021, value: 41136 }
      - { year: 2020, value: 41136 }
      - { year: 2019, value: 40524 }
      - { year: 2018, value: 39732 }
      - { year: 2017, value: 39228 }
      - { year: 2016, value: 38616 }
