# ===== BASE DE DONNEES SQLite =====
spring.datasource.url=jdbc:sqlite:./data/myfinance-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Création automatique du schéma en dev
spring.jpa.hibernate.ddl-auto=update

# Logs SQL désactivés — niveaux gérés dans logback-spring.xml
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Scheduler de mise à jour des cours désactivé en dev
scheduler.enabled=false

# CORS — origines autorisées (frontend React en dev)
cors.allowed-origins=http://localhost:3000

# Protection brute-force — seuil réduit en dev pour faciliter les tests manuels
security.login.max-attempts=3
security.login.base-lock-minutes=1
security.login.max-lock-minutes=10

# CSRF désactivé en dev : frontend (:3000) et backend (:8080) sont sur des origines différentes,
# donc le cookie XSRF-TOKEN posé par le backend n'est pas lisible par Axios côté frontend
security.csrf.enabled=false


server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:/Users/kevindesmay/myfinance-local.p12
server.ssl.key-store-password=myfinanceneogost
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=myfinance
server.servlet.session.cookie.secure=true