# ===== BASE DE DONNEES SQLite =====
spring.datasource.url=jdbc:sqlite:./data/myfinance-dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Création automatique du schéma en dev
spring.jpa.hibernate.ddl-auto=update

# Logs SQL désactivés pour ne pas noyer les logs applicatifs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Scheduler de mise à jour des cours désactivé en dev
scheduler.enabled=false

# CORS — origines autorisées (frontend React en dev)
cors.allowed-origins=http://localhost:3000

# Logs applicatifs
logging.level.com.myfinance=DEBUG
logging.level.org.springframework.security=DEBUG

# Protection brute-force — seuil réduit en dev pour faciliter les tests manuels
security.login.max-attempts=3
security.login.base-lock-minutes=1
security.login.max-lock-minutes=10
