      csg-deductible: 0.0668       # 6,80 % × 0,9825
      csg-non-deductible: 0.0236   # 2,40 % × 0,9825 — prélevée mais non déductible
      crds: 0.0049                  # 0,50 % × 0,9825 — prélevée mais non déductible
      ## RAFP (5 %) ignoré en V1 : assis uniquement sur primes, pas sur TIB
      ## Contribution solidarité (CES) : 0 % depuis le 01/01/2018 (supprimée)
