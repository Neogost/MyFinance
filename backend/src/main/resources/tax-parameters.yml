## Paramètres fiscaux — Barème IRPP
## Mis à jour annuellement par l'administrateur après la loi de finances.
## Modifier ce fichier et redémarrer l'application suffit (pas de recompilation nécessaire).

tax:
  year: 2025
  income-period: "2024"
  # Plafond Annuel de la Sécurité Sociale — mis à jour chaque année
  pass: 47100.0
  # Taux des cotisations salariales légales — mis à jour chaque année
  employee-contributions:
    csg-base-rate: 0.9825            # assiette CSG/CRDS = brut × 98,25%
    csg-deductible-rate: 0.0680      # CSG déductible du revenu imposable
    # CSG non déductible (2,40%) et CRDS (0,50%) prélevées mais hors calcul net imposable
    vieillesse-plafonnee-rate: 0.0690   # dans la limite du PASS
    vieillesse-deplafonnee-rate: 0.0040 # sur totalité du brut
    agirc-arrco-t1-rate: 0.0315         # tranche 1 : 0 → 1 PASS
    ceg-t1-rate: 0.0086                 # contribution d'équilibre général T1
    agirc-arrco-t2-rate: 0.0864         # tranche 2 : 1 → 8 PASS
    ceg-t2-rate: 0.0108                 # contribution d'équilibre général T2
    apec-rate: 0.00024                  # cadres uniquement, jusqu'à 4 PASS
  # Taux forfaitaire cotisations patronales — estimation indicative du super brut (coût employeur)
  employer-flat-rate: 0.45
  flat-rate-deduction:
    rate: 0.10      # Taux abattement forfaitaire frais professionnels (10%)
    min: 504.0      # Plancher de l'abattement en €
    max: 13522.0    # Plafond de l'abattement en €
  brackets:
    - from: 0.0
      to: 11497.0
      rate: 0.00
    - from: 11497.0
      to: 29315.0
      rate: 0.11
    - from: 29315.0
      to: 83823.0
      rate: 0.30
    - from: 83823.0
      to: 180294.0
      rate: 0.41
    - from: 180294.0
      to: ~          # null = borne supérieure infinie
      rate: 0.45
