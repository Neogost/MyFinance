services:
  myfinance:
    build: .
    image: myfinance:latest
    container_name: myfinance
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      # Base de données SQLite persistée sur le NAS
      - /FOLDER/myFinance/data:/data
    environment:
      # Mettre à jour avec votre domaine QNAP une fois configuré
      # Ex : CORS_ALLOWED_ORIGINS=https://xxxxx.com
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
