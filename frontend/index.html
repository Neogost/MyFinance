<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MyFinance - Gestion de budget intelligente</title>
    <meta name="description" content="MyFinance est une application moderne pour suivre vos dépenses, gérer votre budget et améliorer vos finances au quotidien." />
    <meta name="keywords" content="finance, budget, dépenses, argent, épargne, gestion financière" />
    <meta name="author" content="MyFinance" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#4f46e5" />

    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyFinance" />
  </head>

  <body>
    <script>
      (function() {
        var stored = localStorage.getItem('darkMode')
        var dark = stored === 'true' || (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <noscript>Cette application nécessite JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
